<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseShare — Túnel P2P Direto (Cloudflare WebRTC)</title>
  <link rel="stylesheet" href="tailwind.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4" style="min-height: 100vh;">

  <div class="w-[360px] bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-3">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
      <div class="flex items-center gap-2">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="text-xs font-bold uppercase tracking-wider text-orange-300">
          ☁️ Túnel P2P Cloudflare WebRTC
        </span>
      </div>
      <span id="share-id-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
        #---
      </span>
    </div>

    <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex flex-col gap-1">
      <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Arquivo Compartilhado P2P</span>
      <h1 id="file-name" class="text-sm font-bold text-white truncate">Conectando ao remetente...</h1>
      <span id="file-meta" class="text-xs font-mono text-emerald-300">Aguardando metadados P2P...</span>
    </div>

    <!-- Barra de Progresso com Porcentagem em Tempo Real -->
    <div id="progress-section" class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between text-xs">
        <span id="transfer-status" class="text-slate-300 font-medium">Pronto para conectar</span>
        <span id="transfer-pct" class="font-mono font-bold text-orange-300">0%</span>
      </div>
      <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden p-0.5">
        <div
          id="progress-bar"
          class="h-full rounded-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all duration-150"
          style="width: 0%"
        ></div>
      </div>
      <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">
        <span id="bytes-counter">0 B / 0 B</span>
        <span id="speed-counter">0 B/s</span>
      </div>
    </div>

    <!-- Botão Principal de Download P2P -->
    <button
      id="btn-start-download"
      type="button"
      class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 active:scale-[0.98] text-white font-bold text-xs shadow-lg border border-orange-400/30 transition-all cursor-pointer"
    >
      ⬇ Baixar Arquivo Direto (P2P)
    </button>

    <p class="text-[10px] text-slate-500 text-center leading-tight">
      Conexão direta de navegador para navegador via <strong>Cloudflare STUN + WebRTC DataChannel</strong> (Zero Servidor).
    </p>
  </div>

  <script src="receiver.js"></script>
</body>
</html>
